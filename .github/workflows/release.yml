name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows CI run for this exact protected main commit
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: publish-tdsblive-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_COMMIT: ${{ github.sha }}
      SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONARQUBE_CLI_ORG: camarokris
    steps:
      - name: Check out immutable protected main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned deterministic secrets scanner
        run: |
          tool_directory="$RUNNER_TEMP/tdsblive-sonar-cli"
          mkdir -p "$tool_directory"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/linux/sonarqube-cli-1.9.0.15656-linux-x86-64.bin' --output "$tool_directory/sonar"
          printf '%s  %s\n' '42ec815ef8015921a76b76c865932130d756c5c5a977d82bca9fa81d09bfccd8' "$tool_directory/sonar" | sha256sum --check
          chmod +x "$tool_directory/sonar"
          echo "$tool_directory" >> "$GITHUB_PATH"
      - name: Scan trusted source before execution
        run: |
          mapfile -d '' tracked_files < <(git ls-files -z)
          sonar analyze secrets -- "${tracked_files[@]}"
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Require exact successful main build and security checks
        run: python tools/publish_release.py --run-id "$RELEASE_RUN_ID" --commit "$RELEASE_COMMIT" --validate-only
      - name: Download qualified Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-candidate
          path: artifacts/publish-windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download same-run Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-candidate
          path: artifacts/publish-linux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify draft assets, publish Latest and verify public downloads
        run: python tools/publish_release.py --run-id "$RELEASE_RUN_ID" --commit "$RELEASE_COMMIT" --windows artifacts/publish-windows --linux artifacts/publish-linux --output artifacts/publish-verified
