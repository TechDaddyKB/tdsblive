name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Select validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      tier: ${{ steps.plan.outputs.tier }}
    env:
      RUN_SONAR: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out protected policy rather than PR routing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        run: |
          tool_directory="$RUNNER_TEMP/tdsblive-sonar-cli"
          mkdir -p "$tool_directory"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/linux/sonarqube-cli-1.9.0.15656-linux-x86-64.bin' --output "$tool_directory/sonar"
          printf '%s  %s\n' '42ec815ef8015921a76b76c865932130d756c5c5a977d82bca9fa81d09bfccd8' "$tool_directory/sonar" | sha256sum --check
          chmod +x "$tool_directory/sonar"
          echo "$tool_directory" >> "$GITHUB_PATH"

      - name: Scan protected policy before execution
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          mapfile -d '' tracked_files < <(git ls-files -z)
          sonar analyze secrets -- "${tracked_files[@]}"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Select additive checks from the cumulative PR diff
        id: plan
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          if [[ ! -f tools/ci_plan.py ]]; then
            printf '%s\n' 'full=true' 'tier=full' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## CI validation: full' 'Protected base has no routing policy yet; bootstrap requires full qualification.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            python tools/ci_plan.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            python tools/ci_plan.py select --event "$EVENT_NAME" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

  linux-desktop:
    name: Linux desktop tests and coverage
    needs: validation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RUN_SONAR: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out the same source as Windows analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        run: |
          tool_directory="$RUNNER_TEMP/tdsblive-sonar-cli"
          mkdir -p "$tool_directory"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/linux/sonarqube-cli-1.9.0.15656-linux-x86-64.bin' --output "$tool_directory/sonar"
          printf '%s  %s\n' '42ec815ef8015921a76b76c865932130d756c5c5a977d82bca9fa81d09bfccd8' "$tool_directory/sonar" | sha256sum --check
          chmod +x "$tool_directory/sonar"
          echo "$tool_directory" >> "$GITHUB_PATH"

      - name: Scan tracked files before reading source
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          mapfile -d '' tracked_files < <(git ls-files -z)
          sonar analyze secrets -- "${tracked_files[@]}"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Require Linux test prerequisites
        run: |
          test -x /usr/bin/dbus-daemon
          test -x /usr/bin/gio
          python3 --version
          test -x /usr/bin/python3

      - name: Restore locked desktop dependencies
        run: dotnet restore tests/unit/ExtensionSuite.Desktop.Tests/ExtensionSuite.Desktop.Tests.csproj --locked-mode

      - name: Test Linux startup, process ownership and private D-Bus registration
        run: dotnet test tests/unit/ExtensionSuite.Desktop.Tests/ExtensionSuite.Desktop.Tests.csproj --configuration Release --no-restore --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults/Linux

      - name: Qualify same-commit coverage transfer
        run: python -m unittest discover -s tests/replay -p test_linux_coverage.py -v

      - name: Export scanned Linux coverage for the exact checkout
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          python tools/linux_coverage.py export --reports TestResults/Linux --output artifacts/linux-coverage
          sonar analyze secrets artifacts/linux-coverage

      - name: Upload same-run Linux coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-desktop-coverage
          retention-days: 14
          path: artifacts/linux-coverage/
          if-no-files-found: error

  windows:
    name: Windows validation
    needs: validation-plan
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    # Managed-host checks always run; full scope also qualifies portable and installed hosts.
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RUN_SONAR: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'tdsblive-sonar-cli'
          New-Item -ItemType Directory -Force $toolDirectory | Out-Null
          $binary = Join-Path $toolDirectory 'sonar.exe'
          Invoke-WebRequest 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/windows/sonarqube-cli-1.9.0.15656-windows-x86-64.exe' -OutFile $binary
          $expectedHash = '338d0c3817fb09338416d9b3ac6110d96a2a1038d354ae6f1f3dede1a062e12f'
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw 'Sonar CLI checksum mismatch' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Scan tracked files before reading source
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          $trackedFiles = @(git ls-files)
          & sonar analyze secrets @trackedFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.win-x64.lock.json

      - name: Set up pinned Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
          cache-dependency-path: |
            package-lock.json
            tools/browser-qualification/package-lock.json
            tools/api-type-generator/package-lock.json

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Restore locked dependencies and scanner
        shell: pwsh
        run: |
          dotnet restore TDSBLive.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read application release version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $releaseVersion = [string]$properties.Project.PropertyGroup.Version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application release version' }
          "TDSBLIVE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Begin trusted SonarQube analysis
        if: env.RUN_SONAR == 'true'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if (-not $env:SONAR_TOKEN) { throw 'SONAR_TOKEN must be configured for trusted analysis' }
          dotnet sonarscanner begin /k:"camarokris_tdsblive" /o:"camarokris" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$env:SONAR_TOKEN" /v:"$env:TDSBLIVE_VERSION" /d:sonar.projectBaseDir="$pwd" /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" /d:sonar.javascript.lcov.reportPaths="coverage/lcov.info" /d:sonar.exclusions="**/node_modules/**,**/obj/**,**/bin/**,**/dist/**,**/coverage/**,TestResults/**,tests/fixtures/**,references/**,**/wwwroot/editor/**,**/wwwroot/runtime/**,frontend/**/generated/**" /d:sonar.test.inclusions="frontend/**/*.test.tsx,frontend/**/*.test.ts,tests/**" /d:sonar.coverage.exclusions="tests/**,tools/**,frontend/test-setup.ts,frontend/**/vite.config.ts,vitest.config.ts,eslint.config.mjs" /d:sonar.qualitygate.wait="true"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint and type-check frontend
        shell: pwsh
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build editor and lightweight runtime
        run: npm run build

      - name: Build .NET solution
        run: dotnet build TDSBLive.slnx --configuration Release --no-restore --no-incremental

      - name: Scan decompressed evidence before production adapter replay tests
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: python tools/prepare_rumble_replay.py

      - name: Test .NET with OpenCover and TRX
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: dotnet test TDSBLive.slnx --configuration Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Require successful Linux coverage while allowing parallel builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_plan.py wait-coverage

      - name: Download successful Linux coverage from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-desktop-coverage
          path: TestResults/LinuxImported

      - name: Verify exact source commit and remap Linux coverage paths
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: python tools/linux_coverage.py import --directory TestResults/LinuxImported

      - name: Qualify actual isolated desktop control lifecycle
        shell: pwsh
        run: |
          python tools/qualify_desktop_control.py --dotnet (Join-Path $env:DOTNET_ROOT 'dotnet.exe') --assembly src/ExtensionSuite.Host/bin/Release/net10.0/ExtensionSuite.Host.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test frontend with LCOV
        run: npm run test:coverage

      - name: Qualify sanitized capture and synthetic fixtures
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          python tools/rumble_evidence.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/replay -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Qualify isolated host crash recovery and HTTP contract
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: python tools/qualify_foundation.py

      - name: Qualify financial ingestion and crash recovery in an isolated host
        run: python tools/qualify_financial.py

      - name: Configure owned Playwright browser cache
        shell: pwsh
        run: |
          "PLAYWRIGHT_BROWSERS_PATH=$(Join-Path $env:RUNNER_TEMP 'tdsblive-playwright')" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore pinned Playwright browsers from trusted main cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: windows-playwright-${{ hashFiles('tools/browser-qualification/package-lock.json') }}

      - name: Qualify rendered editor in an isolated CI browser
        shell: pwsh
        run: |
          npm ci --prefix tools/browser-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run install-browser --prefix tools/browser-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run qualify --prefix tools/browser-qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save verified Playwright browsers only from protected main
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: windows-playwright-${{ hashFiles('tools/browser-qualification/package-lock.json') }}

      - name: Qualify real-process restart and backup restore
        run: node tools/browser-qualification/recovery-process.mjs

      - name: Verify generated frontend API types
        shell: pwsh
        run: |
          npm ci --prefix tools/api-type-generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run generate --prefix tools/api-type-generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- frontend/editor/src/generated/api-types.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify coverage reports contain production code
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: python tools/verify_coverage.py

      - name: End analysis and require SonarQube quality gate
        if: env.RUN_SONAR == 'true'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build self-contained Windows ZIP and per-user installer
        if: needs.validation-plan.outputs.full == 'true'
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          $innoRoot = Join-Path $env:RUNNER_TEMP 'tdsblive-inno-6.7.3'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $installed = Start-Process $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$innoRoot`"" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          ./tools/build_windows_package.ps1 -Version $env:TDSBLIVE_VERSION -CompilerPath (Join-Path $innoRoot 'ISCC.exe')

      - name: Qualify native Windows packages
        if: needs.validation-plan.outputs.full == 'true'
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: ./tools/qualify_windows_package.ps1 -Version $env:TDSBLIVE_VERSION

      - name: Qualify packaged guide without network access
        if: needs.validation-plan.outputs.full == 'true'
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          sonar analyze secrets release/portable/guide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/browser-qualification/offline-guide.mjs packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate Windows packages
        if: needs.validation-plan.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-candidate
          retention-days: 14
          path: |
            release/TDSBLive-*-win-x64.zip
            release/TDSBLive-*-win-x64-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-evidence
          retention-days: 14
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.opencover.xml
            TestResults/**/coverage.cobertura.xml
            coverage/lcov.info
            artifacts/g02-editor.png
            artifacts/g05-overlay.png
            artifacts/g05-streamer-chat.png
            artifacts/g06-editor.png
            artifacts/ui-redesign/**
            artifacts/windows-tray/**
          if-no-files-found: warn

  linux-package:
    name: Linux companion package
    needs: [validation-plan, windows]
    if: needs.validation-plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RUN_SONAR: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out the exact Windows package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        run: |
          tool_directory="$RUNNER_TEMP/tdsblive-sonar-cli"
          mkdir -p "$tool_directory"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/linux/sonarqube-cli-1.9.0.15656-linux-x86-64.bin' --output "$tool_directory/sonar"
          printf '%s  %s\n' '42ec815ef8015921a76b76c865932130d756c5c5a977d82bca9fa81d09bfccd8' "$tool_directory/sonar" | sha256sum --check
          chmod +x "$tool_directory/sonar"
          echo "$tool_directory" >> "$GITHUB_PATH"

      - name: Scan tracked source before execution
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          mapfile -d '' tracked_files < <(git ls-files -z)
          sonar analyze secrets -- "${tracked_files[@]}"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.linux-x64.lock.json'

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Download qualified Windows packages from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-candidate
          path: artifacts/linux-backend-input

      - name: Qualify Linux archive admission and executable modes
        run: python -m unittest discover -s tests/replay -p test_linux_package.py -v

      - name: Build scanned same-commit Linux companion bundle
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          shopt -s nullglob
          archives=(artifacts/linux-backend-input/TDSBLive-*-win-x64.zip)
          test "${#archives[@]}" -eq 1
          python tools/build_linux_package.py --windows-archive "${archives[0]}" --checksums artifacts/linux-backend-input/SHA256SUMS.txt --output release/linux-candidate

      - name: Install isolated native UI test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xdotool ffmpeg dbus

      - name: Exercise packaged native first-run rendering and Cancel
        env:
          SONARQUBE_CLI_TOKEN: ${{ env.RUN_SONAR == 'true' && secrets.SONAR_TOKEN || '' }}
          SONARQUBE_CLI_ORG: camarokris
        run: |
          shopt -s nullglob
          applications=(release/linux-candidate/TDSBLive-*-linux-x64-wine)
          test "${#applications[@]}" -eq 1
          python tools/qualify_linux_package.py --application-directory "${applications[0]}"

      - name: Upload Linux companion candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-candidate
          retention-days: 14
          path: |
            release/linux-candidate/TDSBLive-*-linux-x64-wine.tar.gz
            release/linux-candidate/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload scanned native Linux evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native-package-evidence
          retention-days: 14
          path: release/linux-native-evidence/
          if-no-files-found: error

  native-tray-probe:
    name: Windows native tray probe
    # Run actual portable desktop interactions promptly, independently of the
    # longer regression/Sonar pipeline. This never replaces its required check
    # or supplies release-publication artifacts.
    needs: validation-plan
    if: needs.validation-plan.outputs.full == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'tdsblive-sonar-cli'
          New-Item -ItemType Directory -Force $toolDirectory | Out-Null
          $binary = Join-Path $toolDirectory 'sonar.exe'
          Invoke-WebRequest 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/windows/sonarqube-cli-1.9.0.15656-windows-x86-64.exe' -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne '338d0c3817fb09338416d9b3ac6110d96a2a1038d354ae6f1f3dede1a062e12f') { throw 'Sonar CLI checksum mismatch' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Scan tracked source before execution
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          $trackedFiles = @(git ls-files)
          & sonar analyze secrets @trackedFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.win-x64.lock.json

      - name: Set up pinned Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
          cache-dependency-path: package-lock.json

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Build current frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build diagnostic Windows packages
        id: packages
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version' }
          $innoRoot = Join-Path $env:RUNNER_TEMP 'tdsblive-inno-6.7.3'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup checksum mismatch' }
          $installed = Start-Process $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$innoRoot`"" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          ./tools/build_windows_package.ps1 -Version $version -CompilerPath (Join-Path $innoRoot 'ISCC.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ purpose = 'Diagnostic packages only; not approved for release';
             checkout = (git rev-parse HEAD); source = '${{ github.event.pull_request.head.sha || github.sha }}';
             run = '${{ github.run_id }}'; version = $version } |
            ConvertTo-Json | Set-Content release/native-diagnostic-build.json -Encoding utf8NoBOM

      - name: Exercise actual portable tray and confirmations
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          $ownedPackage = Join-Path $env:RUNNER_TEMP ('tdsblive-native-probe-' + [Guid]::NewGuid().ToString('N'))
          $archives = @(Get-ChildItem release/TDSBLive-*-win-x64.zip)
          if ($archives.Count -ne 1) { throw 'Expected exactly one current diagnostic ZIP' }
          Expand-Archive $archives[0].FullName $ownedPackage
          $nativePowerShell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          try {
            & $nativePowerShell -NoProfile -File tools/qualify_windows_tray.ps1 -ApplicationDirectory $ownedPackage -EvidenceDirectory artifacts/windows-tray/probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $ownedPackage -Recurse -Force }

      - name: Scan diagnostic artifacts before upload
        id: scanned
        if: always() && steps.packages.outcome == 'success'
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          sonar analyze secrets release/portable release/native-diagnostic-build.json release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path artifacts/windows-tray/probe) {
            sonar analyze secrets artifacts/windows-tray/probe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload scanned diagnostic packages and native evidence
        if: always() && steps.scanned.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-diagnostics
          retention-days: 14
          path: |
            release/TDSBLive-*-win-x64.zip
            release/TDSBLive-*-win-x64-setup.exe
            release/SHA256SUMS.txt
            release/native-diagnostic-build.json
            artifacts/windows-tray/probe/**
          if-no-files-found: error

  desktop-inventory:
    name: Windows desktop inventory
    # Read-only OS-control discovery on a separate disposable CI machine. This
    # job never replaces or satisfies the required Windows build/test check.
    needs: validation-plan
    if: needs.validation-plan.outputs.full == 'true' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned deterministic secrets scanner
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'tdsblive-sonar-cli'
          New-Item -ItemType Directory -Force $toolDirectory | Out-Null
          $binary = Join-Path $toolDirectory 'sonar.exe'
          Invoke-WebRequest 'https://binaries.sonarsource.com/Distribution/sonarqube-cli/1.9.0.15656/windows/sonarqube-cli-1.9.0.15656-windows-x86-64.exe' -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne '338d0c3817fb09338416d9b3ac6110d96a2a1038d354ae6f1f3dede1a062e12f') { throw 'Sonar CLI checksum mismatch' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Scan source and inspect owned display controls
        env:
          SONARQUBE_CLI_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONARQUBE_CLI_ORG: camarokris
        shell: pwsh
        run: |
          $trackedFiles = @(git ls-files)
          & sonar analyze secrets @trackedFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativePowerShell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $nativePowerShell -NoProfile -File tools/inspect_windows_display.ps1 -EvidenceDirectory artifacts/windows-display
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sonar analyze secrets artifacts/windows-display
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload scanned display inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-display-inventory
          retention-days: 14
          path: artifacts/windows-display/display-inventory.json
          if-no-files-found: error

  required-validation:
    name: Windows build and tests
    needs: [validation-plan, linux-desktop, windows, linux-package, native-tray-probe, desktop-inventory]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.validation-plan.result }}
      FULL: ${{ needs.validation-plan.outputs.full }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      LINUX_RESULT: ${{ needs.linux-desktop.result }}
      PACKAGE_RESULT: ${{ needs.linux-package.result }}
      PROBE_RESULT: ${{ needs.native-tray-probe.result }}
      INVENTORY_RESULT: ${{ needs.desktop-inventory.result }}
    steps:
      - name: Require every selected check without changing branch protection
        run: |
          printf '## Selected validation results\n\nScope: %s\n\nPolicy: %s\nWindows: %s\nLinux tests: %s\nLinux package: %s\nNative probe: %s\nInventory: %s\n' \
            "$FULL" "$PLAN_RESULT" "$WINDOWS_RESULT" "$LINUX_RESULT" "$PACKAGE_RESULT" "$PROBE_RESULT" "$INVENTORY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLAN_RESULT" != success || "$WINDOWS_RESULT" != success || "$LINUX_RESULT" != success ]]; then
            echo 'Policy selection and both baseline validation jobs must succeed.' >&2
            exit 1
          fi
          case "$FULL" in
            true)
              if [[ "$PACKAGE_RESULT" != success || "$PROBE_RESULT" != success || "$INVENTORY_RESULT" != success ]]; then
                echo 'Every full-qualification job must succeed; failures or skipped jobs cannot pass.' >&2
                exit 1
              fi
              ;;
            false)
              if [[ "$PACKAGE_RESULT" != skipped || "$PROBE_RESULT" != skipped || "$INVENTORY_RESULT" != skipped ]]; then
                echo 'Executed qualification does not match the selected standard scope.' >&2
                exit 1
              fi
              ;;
            *)
              echo 'Missing or invalid validation scope; required check fails closed.' >&2
              exit 1
              ;;
          esac
          printf '## Required validation passed\n\nSelected scope: %s. Every selected job succeeded.\n' "$FULL" >> "$GITHUB_STEP_SUMMARY"
